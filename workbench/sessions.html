<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect rx='6' width='32' height='32' fill='%23143'/><path d='M8 10l3 3 6-6M8 20l3 3 6-6' stroke='%2366bb6a' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
<title>DB - Sessions</title>
<style>
  :root {
    --bg: #1a1a2e;
    --surface: #16213e;
    --surface2: #0f3460;
    --text: #e0e0e0;
    --muted: #888;
    --border: #333;
    --accent-green: #66bb6a;
    --accent-blue: #4fc3f7;
    --accent-orange: #ff8c00;
    --accent-red: #ff4444;
    --sidebar-w: 280px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; overflow: hidden; }

  /* Sidebar */
  .sidebar { width: var(--sidebar-w); background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
  .sidebar-header { padding: 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .sidebar-header h2 { font-size: 1rem; font-weight: 600; }
  .sidebar-header a { color: var(--muted); text-decoration: none; font-size: 0.8rem; }
  .sidebar-header a:hover { color: var(--text); }
  .new-btn { background: var(--accent-green); color: #000; border: none; border-radius: 6px; padding: 8px 14px; font-size: 0.8rem; font-weight: 600; cursor: pointer; margin: 12px 16px; }
  .new-btn:hover { opacity: 0.9; }

  .session-list { flex: 1; overflow-y: auto; padding: 8px 0; }
  .session-item { padding: 10px 16px; cursor: pointer; border-left: 3px solid transparent; transition: 0.15s; display: flex; align-items: center; gap: 8px; }
  .session-item:hover { background: var(--surface2); }
  .session-item.active { background: var(--surface2); border-left-color: var(--accent-blue); }
  .session-item .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .session-item .dot.alive { background: var(--accent-green); }
  .session-item .dot.dead { background: var(--accent-red); }
  .session-item .info { flex: 1; min-width: 0; }
  .session-item .label { font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .session-item .time { font-size: 0.7rem; color: var(--muted); }
  .session-item .actions { display: none; gap: 4px; }
  .session-item:hover .actions { display: flex; }
  .session-item .actions button { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 0.75rem; padding: 2px 4px; border-radius: 3px; }
  .session-item .actions button:hover { background: var(--border); color: var(--text); }

  /* Rename input */
  .rename-input { background: var(--bg); border: 1px solid var(--accent-blue); color: var(--text); font-size: 0.85rem; padding: 2px 6px; border-radius: 3px; width: 100%; outline: none; }

  /* Archive section */
  .archive-header { padding: 8px 16px; font-size: 0.75rem; color: var(--muted); cursor: pointer; user-select: none; border-top: 1px solid var(--border); margin-top: 8px; }
  .archive-header:hover { color: var(--text); }
  .archive-list { display: none; }
  .archive-list.open { display: block; }
  .archive-list .session-item { opacity: 0.6; }
  .archive-list .session-item:hover { opacity: 1; }

  /* Main panel */
  .main { flex: 1; display: flex; flex-direction: column; }
  .main-empty { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 1.1rem; }
  .main iframe { flex: 1; border: none; background: #000; }

  /* Toast */
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--surface2); border: 1px solid var(--accent-green); border-radius: 8px; padding: 10px 20px; color: var(--accent-green); font-size: 0.85rem; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 1000; }
</style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-header">
    <h2>Sessions</h2>
    <a href="main.html">← Trackers</a>
  </div>
  <button class="new-btn" onclick="createSession()">+ New Session</button>
  <div class="session-list" id="activeList"></div>
  <div class="archive-header" id="archiveToggle" onclick="toggleArchive()">▶ Archived (<span id="archiveCount">0</span>)</div>
  <div class="archive-list" id="archiveList"></div>
</div>

<div class="main" id="mainPanel">
  <div class="main-empty" id="emptyState">Select or create a session</div>
</div>

<div class="toast" id="toast"></div>

<script>
let sessions = [];
let activeSessionId = null;
let pollInterval = null;
let isRenaming = false;

// Check URL params for auto-select
const params = new URLSearchParams(window.location.search);
const autoSelectId = params.get('session');

async function loadSessions() {
  try {
    const res = await fetch('/api/sessions');
    sessions = await res.json();
    if (!isRenaming) render();
    if (autoSelectId && !activeSessionId) {
      selectSession(autoSelectId);
      // Clear the param so refresh doesn't re-select
      window.history.replaceState({}, '', window.location.pathname);
    }
  } catch (e) { console.error('Failed to load sessions:', e); }
}

function render() {
  const active = sessions.filter(s => !s.archived);
  const archived = sessions.filter(s => s.archived);

  document.getElementById('activeList').innerHTML = active.map(s => sessionHTML(s)).join('');
  document.getElementById('archiveList').innerHTML = archived.map(s => sessionHTML(s, true)).join('');
  document.getElementById('archiveCount').textContent = archived.length;
}

function sessionHTML(s, isArchived = false) {
  const isActive = s.id === activeSessionId;
  const dotClass = s.status === 'active' ? 'alive' : 'dead';
  const time = new Date(s.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  const renameBtn = `<button onclick="event.stopPropagation(); startRename('${s.id}')" title="Rename">✏️</button>`;
  const archiveBtn = isArchived
    ? `<button onclick="event.stopPropagation(); unarchiveSession('${s.id}')" title="Unarchive">↩</button>`
    : `<button onclick="event.stopPropagation(); archiveSession('${s.id}')" title="Archive">📦</button>`;
  const killBtn = isArchived && s.status === 'active'
    ? `<button onclick="event.stopPropagation(); killSession('${s.id}')" title="Kill">✕</button>`
    : '';
  const deleteBtn = isArchived
    ? `<button onclick="event.stopPropagation(); deleteSession('${s.id}')" title="Delete">🗑️</button>`
    : '';

  return `<div class="session-item ${isActive ? 'active' : ''}" onclick="selectSession('${s.id}')" ondblclick="startRename('${s.id}')">
    <div class="dot ${dotClass}"></div>
    <div class="info">
      <div class="label" id="label-${s.id}">${escapeHtml(s.label)}</div>
      <div class="time">${time}</div>
    </div>
    <div class="actions">${renameBtn}${archiveBtn}${killBtn}${deleteBtn}</div>
  </div>`;
}

async function selectSession(id) {
  activeSessionId = id;
  const s = sessions.find(x => x.id === id);
  if (!s) return;

  const main = document.getElementById('mainPanel');
  const empty = document.getElementById('emptyState');
  if (empty) empty.remove();

  // Remove existing iframe
  const existing = main.querySelector('iframe');
  if (existing) existing.remove();

  // Ensure ttyd is running (reconnect if user navigated away)
  if (s.status === 'active') {
    try {
      const res = await fetch('/api/sessions/reconnect', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id }) });
      const data = await res.json();
      if (!data.ok) { s.status = 'dead'; render(); return; }
    } catch { /* proceed anyway */ }
  }

  // Small delay to let ttyd bind the port
  await new Promise(r => setTimeout(r, 300));

  const iframe = document.createElement('iframe');
  iframe.src = `http://localhost:${s.port}`;
  main.appendChild(iframe);

  render();
}

async function createSession() {
  try {
    const res = await fetch('/api/sessions/create', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({}) });
    const data = await res.json();
    if (data.ok) {
      await loadSessions();
      // Wait a moment for ttyd to start
      setTimeout(() => selectSession(data.session.id), 800);
      showToast('Session created');
    }
  } catch (e) { showToast('Failed: ' + e.message); }
}

function startRename(id) {
  const labelEl = document.getElementById(`label-${id}`);
  if (!labelEl) return;
  const s = sessions.find(x => x.id === id);
  if (!s) return;

  isRenaming = true;
  const input = document.createElement('input');
  input.className = 'rename-input';
  input.value = s.label;
  input.onblur = () => finishRename(id, input.value);
  input.onkeydown = (e) => {
    if (e.key === 'Enter') input.blur();
    if (e.key === 'Escape') { input.value = s.label; input.blur(); }
  };
  labelEl.replaceWith(input);
  input.focus();
  input.select();
}

async function finishRename(id, newLabel) {
  isRenaming = false;
  if (!newLabel.trim()) { render(); return; }
  try {
    await fetch('/api/sessions/rename', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id, label: newLabel.trim() }) });
    const s = sessions.find(x => x.id === id);
    if (s) s.label = newLabel.trim();
    render();
  } catch (e) { render(); }
}

async function archiveSession(id) {
  await fetch('/api/sessions/archive', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id }) });
  const s = sessions.find(x => x.id === id);
  if (s) s.archived = true;
  if (activeSessionId === id) { activeSessionId = null; resetMainPanel(); }
  render();
  showToast('Session archived');
}

async function unarchiveSession(id) {
  await fetch('/api/sessions/unarchive', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id }) });
  const s = sessions.find(x => x.id === id);
  if (s) s.archived = false;
  render();
  showToast('Session restored');
}

async function killSession(id) {
  await fetch('/api/sessions/kill', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id }) });
  const s = sessions.find(x => x.id === id);
  if (s) s.status = 'dead';
  render();
  showToast('Session killed');
}

async function deleteSession(id) {
  await fetch('/api/sessions/delete', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id }) });
  sessions = sessions.filter(x => x.id !== id);
  if (activeSessionId === id) { activeSessionId = null; resetMainPanel(); }
  render();
  showToast('Session deleted');
}

function resetMainPanel() {
  const main = document.getElementById('mainPanel');
  const existing = main.querySelector('iframe');
  if (existing) existing.remove();
  if (!main.querySelector('.main-empty')) {
    const empty = document.createElement('div');
    empty.className = 'main-empty';
    empty.id = 'emptyState';
    empty.textContent = 'Select or create a session';
    main.appendChild(empty);
  }
}

function toggleArchive() {
  const list = document.getElementById('archiveList');
  const toggle = document.getElementById('archiveToggle');
  const isOpen = list.classList.toggle('open');
  toggle.textContent = `${isOpen ? '▼' : '▶'} Archived (${document.getElementById('archiveCount').textContent})`;
}

function escapeHtml(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.opacity = '1';
  setTimeout(() => t.style.opacity = '0', 3000);
}

// When page regains focus (e.g. window.open from main.html navigates here),
// re-read URL params to auto-select the correct session
window.addEventListener('pageshow', async () => {
  const freshParams = new URLSearchParams(window.location.search);
  const targetId = freshParams.get('session');
  if (targetId && targetId !== activeSessionId) {
    await loadSessions();
    selectSession(targetId);
    window.history.replaceState({}, '', window.location.pathname);
  }
});

// Poll for session status updates
loadSessions();
pollInterval = setInterval(loadSessions, 5000);
</script>

</body>
</html>

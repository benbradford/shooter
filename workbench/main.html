<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect rx='6' width='32' height='32' fill='%23143'/><path d='M8 10l3 3 6-6M8 20l3 3 6-6' stroke='%2366bb6a' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
<title>DB - Tracker</title>
<style>
  :root {
    --bg: #1a1a2e;
    --surface: #16213e;
    --surface2: #0f3460;
    --text: #e0e0e0;
    --muted: #888;
    --border: #333;
    --accent-red: #ff4444;
    --accent-blue: #4fc3f7;
    --accent-green: #66bb6a;
    --accent-orange: #ff8c00;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
  h1 { font-size: 2rem; margin-bottom: 6px; }
  .subtitle { color: var(--muted); margin-bottom: 48px; font-size: 0.95rem; }
  .cards { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 32px 28px; width: 260px; text-decoration: none; color: var(--text); transition: 0.2s; cursor: pointer; }
  .card:hover { border-color: #5599ff; transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
  .card-icon { font-size: 2.4rem; margin-bottom: 12px; }
  .card-title { font-size: 1.2rem; font-weight: 600; margin-bottom: 8px; }
  .card-desc { font-size: 0.8rem; color: var(--muted); line-height: 1.5; }
  .card-count { margin-top: 16px; font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .card-count span { font-size: 1.4rem; font-weight: bold; display: block; margin-top: 2px; }
  .actions { margin-top: 48px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
  .action-btn { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 12px 20px; color: var(--text); font-size: 0.9rem; cursor: pointer; transition: 0.2s; text-decoration: none; }
  .action-btn:hover { border-color: var(--accent-green); transform: translateY(-2px); }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--surface2); border: 1px solid var(--accent-green); border-radius: 8px; padding: 12px 24px; color: var(--accent-green); font-size: 0.85rem; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
</style>
</head>
<body>

<h1>🎮 Dodging Bullets</h1>
<p class="subtitle">Project Trackers</p>

<div class="cards">
  <a class="card" href="architecture-issues.html">
    <div class="card-icon">🔧</div>
    <div class="card-title">Architecture Issues</div>
    <div class="card-desc">Tech debt, code quality, performance issues from architecture reviews.</div>
  </a>

  <a class="card" href="feature-tracker.html">
    <div class="card-icon">✨</div>
    <div class="card-title">Feature Tracker</div>
    <div class="card-desc">Planned features, enhancements, and ideas for future development.</div>
  </a>

  <a class="card" href="bug-tracker.html">
    <div class="card-icon">🐛</div>
    <div class="card-title">Bug Tracker</div>
    <div class="card-desc">Known bugs, reproduction steps, and fix status.</div>
  </a>
</div>

<div class="actions">
  <button class="action-btn" onclick="newSession()">🚀 New Session</button>
  <button class="action-btn" onclick="updateDocs()" title="Launches a kiro agent to analyze recent sessions, update docs, and run an audit">📝 Update Docs</button>
  <button class="action-btn" onclick="commitAll()" title="Opens a kiro agent to generate a commit message, commit all changes, and optionally push">🔀 Commit All</button>
</div>

<div class="toast" id="toast"></div>

<script>
function openSessionTab(sessionId) {
  // Use named window target to reuse existing tab
  const sessionWindow = window.open(`sessions.html?session=${sessionId}`, 'db-sessions');
  if (sessionWindow) {
    sessionWindow.focus();
  }
}

async function newSession() {
  try {
    const res = await fetch('/api/tracker/session', { method: 'POST' });
    const data = await res.json();
    if (data.sessionId) { setTimeout(() => openSessionTab(data.sessionId), 800); }
    showToast('🚀 New kiro session starting...');
  } catch (e) { showToast('Failed: ' + e.message); }
}
async function updateDocs() {
  try {
    const res = await fetch('/api/tracker/update-docs', { method: 'POST' });
    const data = await res.json();
    if (data.sessionId) { setTimeout(() => openSessionTab(data.sessionId), 800); }
    showToast(data.message || 'Launched!');
  } catch (e) { showToast('Failed: ' + e.message); }
}
async function commitAll() {
  try {
    const res = await fetch('/api/tracker/commit', { method: 'POST' });
    const data = await res.json();
    if (data.sessionId) { setTimeout(() => openSessionTab(data.sessionId), 800); }
    showToast('🔀 Commit session starting...');
  } catch (e) { showToast('Failed: ' + e.message); }
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.opacity = '1';
  setTimeout(() => t.style.opacity = '0', 3000);
}
</script>

</body>
</html>

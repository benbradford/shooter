<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect rx='6' width='32' height='32' fill='%23143'/><path d='M8 10l3 3 6-6M8 20l3 3 6-6' stroke='%2366bb6a' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
<title>DB - Tracker</title>
<style>
  :root { --bg: #1a1a2e; --surface: #16213e; --surface2: #0f3460; --text: #e0e0e0; --muted: #888; --border: #333; --critical: #ff4444; --high: #ff8c00; --medium: #ffd700; --low: #4fc3f7; --fixed: #66bb6a; --wontfix: #9e9e9e; --investigating: #ab47bc; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 24px; line-height: 1.5; }
  h1 { font-size: 1.8rem; margin-bottom: 4px; }
  .subtitle { color: var(--muted); margin-bottom: 24px; font-size: 0.9rem; }
  .back { color: var(--muted); text-decoration: none; font-size: 0.85rem; display: inline-block; margin-bottom: 16px; }
  .back:hover { color: var(--text); }
  .stats { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
  .stat { background: var(--surface); border-radius: 8px; padding: 12px 20px; min-width: 120px; }
  .stat-value { font-size: 1.6rem; font-weight: bold; }
  .stat-label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
  .filter-btn { background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 6px 14px; border-radius: 16px; cursor: pointer; font-size: 0.8rem; transition: 0.2s; }
  .filter-btn:hover { border-color: var(--text); }
  .filter-btn.active { background: var(--surface2); border-color: #5599ff; color: #fff; }
  table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: 8px; overflow: hidden; }
  thead { background: var(--surface2); }
  th { text-align: left; padding: 10px 14px; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); }
  td { padding: 10px 14px; border-top: 1px solid var(--border); font-size: 0.85rem; vertical-align: top; }
  tr.fixed td { opacity: 0.5; text-decoration: line-through; }
  tr.wontfix td { opacity: 0.45; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; }
  .badge-critical { background: var(--critical); color: #fff; }
  .badge-high { background: var(--high); color: #000; }
  .badge-medium { background: var(--medium); color: #000; }
  .badge-low { background: var(--low); color: #000; }
  .badge-fixed { background: var(--fixed); color: #000; }
  .badge-wontfix { background: var(--wontfix); color: #000; }
  .badge-investigating { background: var(--investigating); color: #fff; }
  .badge-open { background: transparent; border: 1px solid var(--muted); color: var(--muted); }
  details { margin-top: 4px; }
  details summary { cursor: pointer; color: var(--muted); font-size: 0.8rem; }
  details p { margin-top: 4px; font-size: 0.8rem; color: var(--muted); line-height: 1.4; }
  .actions { display: flex; gap: 4px; flex-wrap: wrap; }
  .act-btn { background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 2px 8px; border-radius: 6px; cursor: pointer; font-size: 0.7rem; transition: 0.2s; white-space: nowrap; }
  .act-btn:hover { border-color: var(--text); }
  .act-btn.fix { background: #1a4a1a; border-color: var(--fixed); color: var(--fixed); }
  .act-btn.fix:hover { background: #2a6a2a; }
  .add-form { background: var(--surface); border-radius: 8px; padding: 16px; margin-bottom: 20px; display: none; }
  .add-form.visible { display: block; }
  .add-form input, .add-form select, .add-form textarea { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 6px 10px; border-radius: 6px; font-size: 0.85rem; width: 100%; margin-bottom: 8px; box-sizing: border-box; font-family: inherit; }
  .add-form textarea { min-height: 60px; resize: vertical; }
  .add-form label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 2px; }
  .add-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .toast { position: fixed; bottom: 20px; right: 20px; background: var(--fixed); color: #000; padding: 10px 20px; border-radius: 8px; font-weight: 600; font-size: 0.85rem; opacity: 0; transition: opacity 0.3s; z-index: 999; }
  .toast.show { opacity: 1; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 1000; }
  .modal-overlay.visible { display: flex; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; width: 500px; max-width: 90vw; max-height: 80vh; overflow-y: auto; }
  .modal h2 { font-size: 1.1rem; margin-bottom: 16px; }
  .modal label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 2px; margin-top: 10px; }
  .modal input, .modal select, .modal textarea { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 6px 10px; border-radius: 6px; font-size: 0.85rem; width: 100%; box-sizing: border-box; font-family: inherit; }
  .modal textarea { min-height: 80px; resize: vertical; }
  .modal-actions { display: flex; gap: 8px; margin-top: 16px; justify-content: flex-end; }
  .modal-actions button { padding: 6px 16px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; border: 1px solid var(--border); }
  .modal-actions .save-btn { background: var(--fixed); color: #000; border-color: var(--fixed); font-weight: 600; }
  .modal-actions .cancel-btn { background: var(--surface2); color: var(--text); }
</style>
</head>
<body>

<a class="back" href="main.html">← Back to Main</a> · <a class="back" href="feature-tracker.html">Features</a> · <a class="back" href="architecture-issues.html">Issues</a> · <a class="back" href="linter-errors.html">Lint</a>
<h1>🐛 Bug Tracker</h1>
<p class="subtitle">Dodging Bullets — Known Bugs &amp; Issues</p>

<div class="stats" id="stats"></div>

<div class="filters" id="filters">
  <button class="filter-btn active" data-filter="all">All</button>
  <button class="filter-btn" data-filter="open">Open</button>
  <button class="filter-btn" data-filter="investigating">Investigating</button>
  <button class="filter-btn" data-filter="fixed">Fixed</button>
  <button class="filter-btn" data-filter="wontfix">Won't Fix</button>
  <button class="filter-btn" data-filter="critical">Critical</button>
  <button class="filter-btn" data-filter="high">High</button>
  <button class="filter-btn" data-filter="medium">Medium</button>
  <button class="filter-btn" data-filter="low">Low</button>
  <button class="filter-btn" style="margin-left:auto" onclick="location.reload()">↻ Refresh</button>
  <button class="filter-btn" style="background:var(--surface2);border-color:var(--fixed);color:var(--fixed)" onclick="toggleAddForm()">+ Add Bug</button>
</div>

<div class="add-form" id="addForm">
  <div class="add-row">
    <div><label>Title</label><input id="add-title" placeholder="Bug title" /></div>
    <div><label>Area</label><input id="add-area" placeholder="e.g. combat, pet, hud" /></div>
  </div>
  <div class="add-row">
    <div><label>Severity</label><select id="add-severity"><option>medium</option><option>low</option><option>high</option><option>critical</option></select></div>
    <div><label>Status</label><select id="add-status"><option>open</option><option>investigating</option></select></div>
  </div>
  <label>Detail</label><textarea id="add-detail" placeholder="Steps to reproduce, expected vs actual..."></textarea>
  <button class="act-btn" style="padding:6px 16px;font-size:0.85rem" onclick="addEntry()">Add Bug</button>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="editModal">
  <div class="modal">
    <h2>Edit Bug</h2>
    <input type="hidden" id="edit-id" />
    <label>Title</label><input id="edit-title" />
    <div class="add-row">
      <div><label>Severity</label><select id="edit-severity"><option>low</option><option>medium</option><option>high</option><option>critical</option></select></div>
      <div><label>Area</label><input id="edit-area" /></div>
    </div>
    <label>Detail</label><textarea id="edit-detail"></textarea>
    <div class="modal-actions">
      <button class="cancel-btn" onclick="closeEditModal()">Cancel</button>
      <button class="save-btn" onclick="saveEdit()">Save</button>
    </div>
  </div>
</div>

<table>
  <thead>
    <tr>
      <th style="width:30px">#</th>
      <th style="width:80px">Severity</th>
      <th style="width:100px">Status</th>
      <th>Bug</th>
      <th style="width:100px">Area</th>
      <th style="width:80px">Added</th>
      <th style="width:140px">Actions</th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>

<script>
// ── STATUS: open | investigating | fixed | wontfix ──
// ── SEVERITY: critical | high | medium | low ──
const BUGS = [
  { id: 1, severity: 'medium', status: 'fixed', title: 'Push icon appears without canPush flag', detail: 'Walking into a pushable entity shows the push icon on the HUD attack button even when canPush WorldState flag is not set to "true". The player correctly cannot enter push state, but the icon override still triggers visually. Fixed by user.', area: 'pushable', added: '2026-05-04' },
  { id: 2, severity: 'high', status: 'fixed', title: 'Pet stuck at level start in dungeon3right', detail: 'Pet spawned at player feet Y position, but collision box (offsetY:8, height:14) overlapped into platform cell below. Fixed by adding PET_SPAWN_OFFSET_Y_PX = -10 to shift pet spawn 10px upward, keeping collision box clear of adjacent platforms.', area: 'pet', added: '2026-05-04' },
  { id: 3, severity: 'medium', status: 'fixed', title: 'Special item pickup distance inconsistent by approach direction', detail: 'Distance measured from player grid collision box center (32px below sprite origin due to offsetY:24 + height/2:8) to item transform (cell center). The 24px pickup radius was too small to cover the asymmetry — approaching from south required getting much closer. Increased PICKUP_DISTANCE_PX from 24 to 48.', area: 'pickup', added: '2026-05-04' },
  { id: 4, severity: 'medium', status: 'fixed', title: 'Health bar shows empty during interactions', detail: 'During NPC interactions the health bar sometimes displayed as empty despite having health. Fixed by hiding the health bar entirely during interactions — HudBarComponent checks isInInteraction and sets all bar elements to alpha 0.', area: 'hud', added: '2026-05-04' },
  { severity: 'low', status: 'fixed', title: 'duplicate fav icons', detail: 'the editor, game and tracker all use the same favicon, this makes it difficult to distinguish what each tab is for. It would also help if the tracker was just called \'DB - Tracker\' and the editor was just called \'DB - Editor\' so i can easily see the name in the tabs', area: 'meta', id: 5, added: '2026-05-04' },
  { severity: 'low', status: 'fixed', title: 'Editor switching views when clearing textures', detail: 'When i select a cell and clear the texture in it, there are some drastic changes to the view, for instance, the water textures all disappear and just display debug graphics. shadows start rendering on platforms even when the level theme doesn\'t have shadows.', area: 'editor', id: 6, added: '2026-05-04' },
  { severity: 'medium', status: 'fixed', title: 'Punch charge anim not releasing when doing normal punch', detail: 'When i hold punch to charge a super punch and move, but then release it early, the player should continue performing a normal punch if they didn\'t hold long enough to do a super punch. Logically this works, but the regular punch anim doesn\'t play, instead the player continues doing their charging walk animation, when instead they should remain stationary and just perform a regular punch', area: 'game', id: 7, added: '2026-05-04' },
  { severity: 'medium', status: 'fixed', title: 'Cannot mark bug as fixed', detail: 'Entry block detection in vite.config.ts searched forward from id field, missing status field when id was near end of object. Also added watch exclusion for trackers/ to prevent Vite page reloads on file write.', area: 'tracker', id: 8, added: '2026-05-04' },
  { severity: 'low', status: 'fixed', title: 'Zdepth of player alters when jumping into water', detail: 'For some reason, when i jump into the water, if there is a background texture above me, it appears in front of me. I don\'t know if background textures are always at a higher depth than the player or not but I don\'t think so. Why does the player Z depth change during the jump into the water?', area: 'game', id: 9, added: '2026-05-04' },
  { severity: 'medium', status: 'fixed', title: 'Change collision box when swimming', detail: 'When swimming, the player still uses the grid collision box, which is set to be at the \'feet\' of the player. this no longer makes sense when playing as the player is laying flat and swimming. Use a stack for grid collision boxes and push a new one on top when jumping in to  swim that is just a box around the player\'s center. pop the collision box when jumping out the water', area: 'game', id: 10, added: '2026-05-06' },
  { severity: 'medium', status: 'fixed', title: 'Swimming corners are buggy', detail: `There is an issue in that if a player is swimming and approaches a corner like
this whilst swimming right:

    |
    | 
    |_____  
   P X

They will attempt to jump out of the water, but because their momentum is right,
they jump right and land in water again. I think the easiest fix is to check if
the landing location would be in a water cell, and if it would be, just block
the player from exiting, unless you have any other bright ideas.`, area: '', id: 11, added: '2026-05-06' },
  { severity: 'medium', status: 'fixed', title: 'Charging punch and then releasing causes problems', detail: 'when i hold punch to charge, but release before supercharged, there are 2 problems.. first is that the actual punch happens before the anim is on the correct punch frame. second, if i am walking at the time and holding walk, one the punch finishes, the player keeps moving but their anim is just a single-frame idle anim', area: 'combat', id: 12, added: '2026-05-06' },
  { severity: 'low', status: 'fixed', title: 'Unable to remove archived sessions', detail: 'In the sessions tab, it shows archived sessions on the left, however there are some there that i cannot remove. They might be from a previous incarnation of the sessions handler or it might be a bug. please ensure they are removed and ensure there is no bug', area: 'sessions', id: 13, added: '2026-05-07' },
  { severity: 'medium', status: 'fixed', title: 'Add scrolling to sessions', detail: 'I should be able to scroll up and down in a session to see the history but there is no scrollbar on the right and if i do a double press and slide up and down, it toggles through previous commands, i would expect it to scroll up / down in the session so i can see history', area: 'sessions', id: 14, added: '2026-05-09' },
  { severity: 'critical', status: 'fixed', title: 'Player currentCell not always updating - exits broken', detail: 'Two bugs: (1) currentCell was set to top-left of collision box instead of center — small 34x16 box could skip cells. Fixed to use centerCell. (2) Tag index refactoring removed entities from tagIndex on removeOccupant even when entity still occupied other cells — getEntitiesWithTag(player) returned empty during cell transitions. Fixed with occupancy reference counting.', area: 'movement', id: 15, added: '2026-05-09' },
  { severity: 'critical', status: 'fixed', title: 'cannot throw pet on android', detail: 'in android, clicking on the pet icon with the rock equpped doesnt allow me to throw the rock. the rocks seems to jump towards the player, but the throwing phase doesnt initiate and the rock just goes back to walking around. the player\'s throw anim doesn;t initiate', area: 'gameplay', id: 16, added: '2026-05-10' },
  { severity: 'medium', status: 'fixed', title: 'Unable to fix linter issues with claude', detail: 'In the bug fix menu, i can choose to fix with claude or kiro. i want the optino to fix with claude in the linter, features, tech debt trackers as well', area: 'tracker', id: 17, added: '2026-05-11' },
  { severity: 'medium', status: 'fixed', title: 'fixing linter issue with claude causes previously archived sessions to be unarchived', detail: '', area: 'tracker', id: 18, added: '2026-05-11' },
  { severity: 'medium', status: 'fixed', title: 'throwing pet whilst jumping into water causes freeze', detail: 'if i walk towards water and go to throw the rock just before i enter, then it is possible that i can jump into the water in a pet throw state. I am then unable to move or throw the pet. We should prevent the player from entering the water if in throw mode. The easiest way might be to ensure the player stops moving suddenly as soon as the pet throw mechanism is engaged', area: 'game', id: 19, added: '2026-05-11' },
  { severity: 'low', status: 'fixed', title: 'small mushrooms can overheal', detail: 'when collecting small mushrooms to increase health, you cannot go over max health, it should cap at maxHealth', area: 'gameplay', id: 20, added: '2026-05-11' },
  { severity: 'medium', status: 'fixed', title: 'fence reappears on grass_overworld1', detail: 'In grass_overworld1.json there is a fence at the bottom which disappears when interacting first time with the wizard Otis. but when i leave th level and re-enter it, the fence re-appears. I note that the grid cells are no longer blocked, so that part worked, but the backgroundTexture should not reappear', area: 'gameplay', id: 21, added: '2026-05-16' },
  { severity: 'high', status: 'fixed', title: 'can pass through wall to exit in grass_overworld1', detail: 'At the top of the grass_overworld1 level are 2 breakable walls that are on the same cells as exits to grass_overworldn. It is currently possible to walk into the exits even when there are breakables on those cells. it should not be possible to exit until the breakable has been destroyed', area: 'gameplay', id: 22, added: '2026-05-16' },
  { severity: 'high', status: 'fixed', title: 'small mushroom pickup randomly appearing', detail: 'In grass_overworld1.json, after being granted the special punch ability by Otis, for some reason, 2 random small mushroom pickups appeared randomly in the level despite nothing being destroyed and nothing being killed. the small mushrooms could not be picked up, they just existed as textures on the map', area: 'gameplay', id: 23, added: '2026-05-16' },
  { severity: 'high', status: 'fixed', title: 'Can enter water from south even when cannot swim', detail: 'GridMovementValidator now checks the visual-center cell when moving north — if it is water and canSwim is false, movement is blocked. Without this, the player\'s collision box (offset south of the visual sprite) could walk onto water from below.', area: 'gameplay', id: 24, added: '2026-05-16' },
  { severity: 'critical', status: 'fixed', title: 'Punch doesn\'t work', detail: 'It is not possible to punch, either with space or by pressing the punch icon, even if canPunch: true is set. This is a recently introduced bug, possibly a side-effect of some of the issues we recently fixed', area: 'combat', id: 25, added: '2026-05-20' },
  { severity: 'medium', status: 'open', title: 'pet doesnt follow after jump', detail: 'whenever a pet jumps off of a platform with me, they land and then immediately go back to their previous position. they should stay in the same place as the player', area: 'pet', id: 26, added: '2026-05-21' },
];

function severityOrder(s) { return { critical: 0, high: 1, medium: 2, low: 3 }[s] ?? 4; }
function statusOrder(s) { return { open: 0, investigating: 1, fixed: 2, wontfix: 3 }[s] ?? 4; }

function renderStats() {
  const el = document.getElementById('stats');
  const open = BUGS.filter(b => b.status === 'open').length;
  const investigating = BUGS.filter(b => b.status === 'investigating').length;
  const fixed = BUGS.filter(b => b.status === 'fixed').length;
  const critical = BUGS.filter(b => b.severity === 'critical' && b.status !== 'fixed').length;
  el.innerHTML = `
    <div class="stat"><div class="stat-value">${BUGS.length}</div><div class="stat-label">Total</div></div>
    <div class="stat"><div class="stat-value" style="color:var(--critical)">${critical}</div><div class="stat-label">Critical Open</div></div>
    <div class="stat"><div class="stat-value" style="color:#fff">${open}</div><div class="stat-label">Open</div></div>
    <div class="stat"><div class="stat-value" style="color:var(--investigating)">${investigating}</div><div class="stat-label">Investigating</div></div>
    <div class="stat"><div class="stat-value" style="color:var(--fixed)">${fixed}</div><div class="stat-label">Fixed</div></div>
  `;
}

function renderTable(filter) {
  const tbody = document.getElementById('tbody');
  let items = [...BUGS];
  if (['open','investigating','fixed','wontfix'].includes(filter)) items = items.filter(b => b.status === filter);
  else if (['critical','high','medium','low'].includes(filter)) items = items.filter(b => b.severity === filter);
  items.sort((a, b) => statusOrder(a.status) - statusOrder(b.status) || severityOrder(a.severity) - severityOrder(b.severity));

  if (items.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7" class="empty">No bugs logged yet.</td></tr>';
    return;
  }
  tbody.innerHTML = items.map(b => `
    <tr class="${b.status}">
      <td>${b.id}</td>
      <td><span class="badge badge-${b.severity}">${b.severity}</span></td>
      <td><span class="badge badge-${b.status}">${b.status === 'wontfix' ? "won't fix" : b.status}</span></td>
      <td><strong>${b.title}</strong>${b.detail ? '<details><summary>Details</summary><p>' + b.detail + '</p></details>' : ''}</td>
      <td>${b.area || '—'}</td>
      <td>${b.added}</td>
      <td class="actions">
        <button class="act-btn" title="Edit this bug" onclick="editEntry(${b.id})">✏️</button>
        ${b.status !== 'fixed' ? `<button class="act-btn" title="Mark as fixed" onclick="setStatus(${b.id},'fixed')">✓ Fixed</button>` : ''}
        ${b.status === 'open' ? `<button class="act-btn" title="Mark as investigating" onclick="setStatus(${b.id},'investigating')">🔍</button>` : ''}
        ${b.status !== 'wontfix' && b.status !== 'fixed' ? `<button class="act-btn" title="Mark as won't fix" onclick="setStatus(${b.id},'wontfix')">✗</button>` : ''}
        ${b.status === 'fixed' || b.status === 'wontfix' ? `<button class="act-btn" title="Reopen this bug" onclick="setStatus(${b.id},'open')">↺ Reopen</button>` : ''}
        ${b.status !== 'fixed' ? `<button class="act-btn fix" title="Fix with Kiro" onclick="fixEntry(${b.id},'kiro')">🤖 Fix</button>` : ''}
        ${b.status !== 'fixed' ? `<button class="act-btn fix" title="Fix with Claude" onclick="fixEntry(${b.id},'claude')" style="border-color:#b388ff;color:#b388ff;background:#1a1a3a">🟣 Fix</button>` : ''}
        ${b.status !== 'fixed' ? `<button class="act-btn" title="Diagnose: explain the issue and approach without changing code" onclick="diagnoseEntry(${b.id})">🔍</button>` : ''}
      </td>
    </tr>
  `).join('');
}

document.getElementById('filters').addEventListener('click', e => {
  if (!e.target.matches('.filter-btn')) return;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  renderTable(e.target.dataset.filter);
});

renderStats();
renderTable('all');

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

function toggleAddForm() {
  document.getElementById('addForm').classList.toggle('visible');
}

async function setStatus(id, status) {
  await fetch('/api/tracker/update', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ tracker: 'bugs', id, fields: { status } })
  });
  const bug = BUGS.find(b => b.id === id);
  if (bug) bug.status = status;
  renderStats();
  renderTable(document.querySelector('.filter-btn.active')?.dataset.filter || 'all');
  showToast(`Bug #${id} → ${status}`);
}

async function addEntry() {
  const title = document.getElementById('add-title').value.trim();
  if (!title) return;
  const entry = {
    severity: document.getElementById('add-severity').value,
    status: document.getElementById('add-status').value,
    title,
    detail: document.getElementById('add-detail').value.trim(),
    area: document.getElementById('add-area').value.trim(),
  };
  const res = await fetch('/api/tracker/add', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ tracker: 'bugs', entry })
  });
  const result = await res.json();
  entry.id = result.id;
  entry.added = new Date().toISOString().slice(0, 10);
  BUGS.push(entry);
  renderStats();
  renderTable('all');
  document.getElementById('addForm').classList.remove('visible');
  document.getElementById('add-title').value = '';
  document.getElementById('add-detail').value = '';
  document.getElementById('add-area').value = '';
  showToast(`Bug #${result.id} added`);
}

let _fixInProgress = false;
async function fixEntry(id, engine = 'kiro') {
  if (_fixInProgress) return;
  _fixInProgress = true;
  const bug = BUGS.find(b => b.id === id);
  if (!bug) { _fixInProgress = false; return; }
  const tag = engine === 'claude' ? '🟣' : '🤖';
  showToast(`${tag} Starting fix for bug #${id}...`);
  try {
    const resp = await fetch('/api/tracker/fix', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tracker: 'bugs', id, title: bug.title, detail: bug.detail || '', engine })
    });
    const data = await resp.json();
    if (data.sessionId) {
      try { const w = window.open(`sessions.html?session=${data.sessionId}`, 'db-sessions'); if (w) w.focus(); } catch {}
    }
    showToast(`${tag} Session launched for bug #${id}`);
  } catch (e) { showToast(`❌ Error: ${e.message}`); }
  _fixInProgress = false;
}

async function diagnoseEntry(id) {
  const bug = BUGS.find(b => b.id === id);
  if (!bug) return;
  const resp = await fetch('/api/tracker/fix', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ tracker: 'bugs', id, title: bug.title, detail: bug.detail || '', diagnoseOnly: true })
  });
  const data = await resp.json();
  if (data.sessionId) { 
    const sessionWindow = window.open(`sessions.html?session=${data.sessionId}`, 'db-sessions');
    if (sessionWindow) sessionWindow.focus();
  }
  showToast(`🔍 Diagnosing bug #${id}...`);
}

function editEntry(id) {
  const bug = BUGS.find(b => b.id === id);
  if (!bug) return;
  document.getElementById('edit-id').value = id;
  document.getElementById('edit-title').value = bug.title || '';
  document.getElementById('edit-severity').value = bug.severity || 'medium';
  document.getElementById('edit-area').value = bug.area || '';
  document.getElementById('edit-detail').value = bug.detail || '';
  document.getElementById('editModal').classList.add('visible');
}

function closeEditModal() { document.getElementById('editModal').classList.remove('visible'); }

async function saveEdit() {
  const id = Number(document.getElementById('edit-id').value);
  const fields = {
    title: document.getElementById('edit-title').value.trim(),
    severity: document.getElementById('edit-severity').value,
    area: document.getElementById('edit-area').value.trim(),
    detail: document.getElementById('edit-detail').value.trim(),
  };
  await fetch('/api/tracker/update', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ tracker: 'bugs', id, fields }) });
  const bug = BUGS.find(b => b.id === id);
  if (bug) Object.assign(bug, fields);
  closeEditModal();
  renderTable(document.querySelector('.filter-btn.active')?.dataset.filter || 'all');
  showToast(`Bug #${id} updated`);
}
</script>
</body>

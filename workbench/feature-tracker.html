<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect rx='6' width='32' height='32' fill='%23143'/><path d='M8 10l3 3 6-6M8 20l3 3 6-6' stroke='%2366bb6a' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
<title>DB - Tracker</title>
<style>
  :root { --bg: #1a1a2e; --surface: #16213e; --surface2: #0f3460; --text: #e0e0e0; --muted: #888; --border: #333; --high: #ff8c00; --medium: #ffd700; --low: #4fc3f7; --done: #66bb6a; --cancelled: #9e9e9e; --in-progress: #ab47bc; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 24px; line-height: 1.5; }
  h1 { font-size: 1.8rem; margin-bottom: 4px; }
  .subtitle { color: var(--muted); margin-bottom: 24px; font-size: 0.9rem; }
  .back { color: var(--muted); text-decoration: none; font-size: 0.85rem; display: inline-block; margin-bottom: 16px; }
  .back:hover { color: var(--text); }
  .stats { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
  .stat { background: var(--surface); border-radius: 8px; padding: 12px 20px; min-width: 120px; }
  .stat-value { font-size: 1.6rem; font-weight: bold; }
  .stat-label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
  .filter-btn { background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 6px 14px; border-radius: 16px; cursor: pointer; font-size: 0.8rem; transition: 0.2s; }
  .filter-btn:hover { border-color: var(--text); }
  .filter-btn.active { background: var(--surface2); border-color: #5599ff; color: #fff; }
  table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: 8px; overflow: hidden; }
  thead { background: var(--surface2); }
  th { text-align: left; padding: 10px 14px; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); }
  td { padding: 10px 14px; border-top: 1px solid var(--border); font-size: 0.85rem; vertical-align: top; }
  tr.done td { opacity: 0.5; text-decoration: line-through; }
  tr.cancelled td { opacity: 0.45; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; }
  .badge-high { background: var(--high); color: #000; }
  .badge-medium { background: var(--medium); color: #000; }
  .badge-low { background: var(--low); color: #000; }
  .badge-done { background: var(--done); color: #000; }
  .badge-cancelled { background: var(--cancelled); color: #000; }
  .badge-in-progress { background: var(--in-progress); color: #fff; }
  .badge-planned { background: transparent; border: 1px solid var(--muted); color: var(--muted); }
  details { margin-top: 4px; }
  details summary { cursor: pointer; color: var(--muted); font-size: 0.8rem; }
  details p { margin-top: 4px; font-size: 0.8rem; color: var(--muted); line-height: 1.4; }
  .actions { display: flex; gap: 4px; flex-wrap: wrap; }
  .act-btn { background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 2px 8px; border-radius: 6px; cursor: pointer; font-size: 0.7rem; transition: 0.2s; white-space: nowrap; }
  .act-btn:hover { border-color: var(--text); }
  .act-btn.fix { background: #1a4a1a; border-color: var(--done); color: var(--done); }
  .act-btn.fix:hover { background: #2a6a2a; }
  .add-form { background: var(--surface); border-radius: 8px; padding: 16px; margin-bottom: 20px; display: none; }
  .add-form.visible { display: block; }
  .add-form input, .add-form select, .add-form textarea { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 6px 10px; border-radius: 6px; font-size: 0.85rem; width: 100%; margin-bottom: 8px; box-sizing: border-box; font-family: inherit; }
  .add-form textarea { min-height: 60px; resize: vertical; }
  .add-form label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 2px; }
  .add-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .toast { position: fixed; bottom: 20px; right: 20px; background: var(--done); color: #000; padding: 10px 20px; border-radius: 8px; font-weight: 600; font-size: 0.85rem; opacity: 0; transition: opacity 0.3s; z-index: 999; }
  .toast.show { opacity: 1; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 1000; }
  .modal-overlay.visible { display: flex; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; width: 500px; max-width: 90vw; max-height: 80vh; overflow-y: auto; }
  .modal h2 { font-size: 1.1rem; margin-bottom: 16px; }
  .modal label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 2px; margin-top: 10px; }
  .modal input, .modal select, .modal textarea { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 6px 10px; border-radius: 6px; font-size: 0.85rem; width: 100%; box-sizing: border-box; font-family: inherit; }
  .modal textarea { min-height: 80px; resize: vertical; }
  .modal-actions { display: flex; gap: 8px; margin-top: 16px; justify-content: flex-end; }
  .modal-actions button { padding: 6px 16px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; border: 1px solid var(--border); }
  .modal-actions .save-btn { background: var(--done); color: #000; border-color: var(--done); font-weight: 600; }
  .modal-actions .cancel-btn { background: var(--surface2); color: var(--text); }
</style>
</head>

<h1>✨ Feature Tracker</h1>
<p class="subtitle">Dodging Bullets — Planned Features &amp; Enhancements</p>

<div class="stats" id="stats"></div>

<div class="filters" id="filters">
  <button class="filter-btn active" data-filter="all">All</button>
  <button class="filter-btn" data-filter="planned">Planned</button>
  <button class="filter-btn" data-filter="in-progress">In Progress</button>
  <button class="filter-btn" data-filter="done">Done</button>
  <button class="filter-btn" data-filter="cancelled">Cancelled</button>
  <button class="filter-btn" data-filter="high">High</button>
  <button class="filter-btn" data-filter="medium">Medium</button>
  <button class="filter-btn" data-filter="low">Low</button>
  <button class="filter-btn" style="margin-left:auto" onclick="location.reload()">↻ Refresh</button>
  <button class="filter-btn" style="background:var(--surface2);border-color:var(--done);color:var(--done)" onclick="toggleAddForm()">+ Add Feature</button>
</div>

<div class="add-form" id="addForm">
  <div class="add-row">
    <div><label>Title</label><input id="add-title" placeholder="Feature title" /></div>
    <div><label>Category</label><input id="add-category" placeholder="e.g. gameplay, editor, tooling" /></div>
  </div>
  <div class="add-row">
    <div><label>Priority</label><select id="add-priority"><option>medium</option><option>low</option><option>high</option></select></div>
    <div><label>Status</label><select id="add-status"><option>planned</option><option>in-progress</option></select></div>
  </div>
  <label>Detail</label><textarea id="add-detail" placeholder="Feature description..."></textarea>
  <button class="act-btn" style="padding:6px 16px;font-size:0.85rem" onclick="addEntry()">Add Feature</button>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="editModal">
  <div class="modal">
    <h2>Edit Feature</h2>
    <input type="hidden" id="edit-id" />
    <label>Title</label><input id="edit-title" />
    <div class="add-row">
      <div><label>Priority</label><select id="edit-priority"><option>low</option><option>medium</option><option>high</option></select></div>
      <div><label>Category</label><input id="edit-category" /></div>
    </div>
    <label>Detail</label><textarea id="edit-detail"></textarea>
    <div class="modal-actions">
      <button class="cancel-btn" onclick="closeEditModal()">Cancel</button>
      <button class="save-btn" onclick="saveEdit()">Save</button>
    </div>
  </div>
</div>

<table>
  <thead>
    <tr>
      <th style="width:30px">#</th>
      <th style="width:80px">Priority</th>
      <th style="width:90px">Status</th>
      <th>Feature</th>
      <th style="width:100px">Category</th>
      <th style="width:80px">Added</th>
      <th style="width:140px">Actions</th>
  <tbody id="tbody"></tbody>
</table>

<script>
// ── STATUS: planned | in-progress | done | cancelled ──
// ── PRIORITY: high | medium | low ──
const FEATURES = [
  { id: 1, priority: 'medium', status: 'done', title: 'Water entry/exit uses jump animation instead of hop', detail: 'Currently entering and exiting water uses a hop sequence that feels jangly. Replace with the same jump animation used for platform/void jumps (JumpComponent), but only jumping a single cell to enter or exit the water. Should feel smooth and consistent with other jump mechanics.', category: 'movement', added: '2026-05-04' },
  { id: 2, priority: 'medium', status: 'done', title: 'Editor paint tool with in-game rendering', detail: 'Paint directly on the level canvas in the editor and see results in-game. Features: color wheel picker (including alpha/transparency), adjustable brush size, straight line mode (click-drag) and single-cell edits, undo/redo via Cmd+Z / Cmd+Shift+Z plus UI buttons, delete button to remove all paint changes, paint data stored in level JSON and rendered in-game. Should support freehand painting and shift-click straight lines. it is important to keep the file size down for this, we either have some inline json to represent the drawings, or it reerences another file with a compressed file format or something like that.', category: 'editor', added: '2026-05-04', designDoc: 'features/editor-paint/editor-paint.md' },
  { id: 3, priority: 'medium', status: 'done', title: 'Interactive project trackers via Vite dev server', detail: 'Make bug/feature/architecture trackers interactive in the browser. Phase 1: Add Vite dev server API endpoints to read/write tracker HTML files (same pattern as level editor save). Add UI buttons to mark items done/fixed, change status, and add new entries via forms. Phase 2 (stretch): Add a "Fix" button that invokes kiro-cli to automatically fix the bug/issue.', category: 'tooling', added: '2026-05-04' },
  { id: 4, priority: 'high', status: 'done', title: 'Session-aware doc updates from kiro conversation history', detail: 'When user says "update the docs", analyze recent kiro sessions (not git diffs) to understand what was hard, what context was missing, and what patterns emerged — then use that to improve docs and agent context. Implementation: (1) Create a script (scripts/extract-sessions.mjs) that reads ~/.kiro/sessions/cli/*.json, filters by cwd containing "dodging-bullets", filters by updated_at since a stored timestamp in tmp/last-doc-update-timestamp.txt, and extracts conversation content from matching .jsonl files. (2) The script outputs a summary of: user requests, problems encountered, fixes applied, context that was missing, patterns that repeated. (3) The agent reads this summary and uses it to update docs, agent instructions, and context entries. (4) After updating, writes the current ISO timestamp to tmp/last-doc-update-timestamp.txt as the new breakpoint. Session JSON structure: { session_id, cwd, created_at, updated_at, title, session_state }. JSONL files contain the full conversation transcript (one JSON object per line with role and content). There are ~125 sessions for this project. The script should be invokable as: node scripts/extract-sessions.mjs [--since ISO_TIMESTAMP] [--limit N]. Output should be concise enough to fit in agent context (summarize, dont dump raw transcripts).', category: 'tooling', added: '2026-05-06' },
  { priority: 'low', status: 'done', title: 'refresh issue tracker', detail: 'i want to add a new button to the issue tracker page called \'refresh issues\' that will launch kiro agent (the same way as when we click fix on an issue) and will run the db-archtect agent to get a full picture of outstanding issues. It should then, verify if any of the outstanding issues have been fixed, or add any new informatino it has found to existing issues, or add any new found issues directly to the tracker', category: 'tracker, archtecture', id: 4, added: '2026-05-06' },
  { priority: 'low', status: 'done', title: 'Help me Device feature on issues', detail: 'On the issue tracker, add a \'help me decide\' button which launches a kiro agent which looks at all issues and gives a summary of what it recommends tackling next', category: 'tracker', id: 5, added: '2026-05-06' },
  { priority: 'medium', status: 'done', title: 'Track git changes', detail: 'Just like we have a way of tracking history of kiro sessions so we can update the docs, i want to be able to update all work done since the last git commit. Then when i want to commit changes, there should be a button called \'commit all\' that opens up a new terminal tab and runs a script that is able to do a git add . alond with a git commit -m"<message summarising all changes since last commit>" and then updates some marker so we know we have no new changes. and the next time we want to do a git commit, it will add a message based on changes since the last commit', category: 'tracker', id: 6, added: '2026-05-06' },
  { priority: 'medium', status: 'done', title: 'Browser-based session manager with multi-session support', detail: 'Instead of opening a new browser tab for each kiro session, have a single persistent page (sessions.html) that manages all active sessions. Left sidebar shows all open sessions — clicking one shows its terminal in the main panel (iframe to ttyd). Features: (1) Auto-naming — AI generates a brief title summarising what the session is doing, with fallback names like Session 1, Session 2. (2) Rename — click session name to edit it manually. (3) Archive — move a session to an archived section at the bottom-left, collapsible, can be recalled/reopened later. (4) All tracker Fix/Diagnose/Refresh/Decide buttons route to this page instead of opening new tabs. (5) New Session button creates a blank dodging-bullets agent session. Backend needs: session registry (track port, label, status, archived), cleanup of dead ttyd processes, session list endpoint. Drop --once flag, manage lifecycle ourselves.', category: 'tooling', id: 7, added: '2026-05-06' },
  { priority: 'medium', status: 'done', title: 'Allow custom z for background textures', detail: 'I want to be able to override the z depth of background textures. we already have transform overrides, can we also add Z transform override. leave it blank to use the default, but if it is set then use that Z when rendering. The editor will probably need a check box as well as a number inut for this, the checkbox to turn override on or off. apply the z change in the edtior gameplay window if applying it', category: 'graphics', id: 8, added: '2026-05-09' },
  { priority: 'medium', status: 'done', title: 'Session pinning', detail: 'I want the ability to pin sessions to a separate section in the bar on the left of the session tracker. This is because i have repeated tasks such as updating docs, refreshing issues, committing files and i want to be able to keep reusing those prompts.', category: 'tooling', id: 9, added: '2026-05-09' },
  { priority: 'medium', status: 'done', title: 'auto-heal and collection feature', detail: 'I want to add the ability to gain autoheal feature. There will be a witch with a cauldron that tells you she can give you a special potion if you collect some ingredients: Glowcap Mushrooms (Regrowth), Root Parasite (Active healing), Everroot (Endless regeneration), Bone Marrow Chunk (Flesh restoration), Ember Moss (Activation). After collecting all of these, you will gain the autoHeal feature (already implemented, just need to turn autoHeal=true state flag). We still need witch and cauldron assets (cauldron must boil). We need assets for all ingredients and need to decide on placement and game pacing. Items can exist in chests at various secret points. Cannot implement as-is since we are missing assets and placement ideas — adding here to remember.', category: 'gameplay', id: 10, added: '2026-05-09' },
  { priority: 'medium', status: 'done', title: 'Fixed camera levels', detail: 'I want to add the ability to be able to have some levels use a fixed camera that doesn\'t scroll. Instead, for fixed-camera levels, the camera just stays fixed with a specirfied cell being in the center of the view. Sor for example, house3_interior I wnt to have a fixed camera on cell 5,4. Make this an option in the Level tab of the editor, whereby fixed-camera is a checkbox (default to off) and if it is on then you can specify a cell center, which by default is basically the middle of the grid', category: 'gameplay', id: 11, added: '2026-05-10' },
  { priority: 'medium', status: 'done', title: 'Add more testing and make it integral to building features', detail: 'Root cause: db-implementor had testing explicitly removed due to timeout issues. Also 5 player tests are stale (assume shooting — player now punches) and must be deleted. Fix: clean up stale tests, re-enable using test:headless:single (handles own server lifecycle), add test spec phase to design process, make test pass a hard gate before task completion. Coverage gaps: pushables, lasers, levers, escorts, breakables, holes, combat/punch, water, void jumping, world state. See features/testing-integration/README.md for full plan.', category: 'testing', id: 12, added: '2026-05-11' },
  { priority: 'medium', status: 'done', title: 'Session redesign — KiRoom-inspired structured sessions', detail: 'Replace ttyd terminal iframes with a proper chat UI backed by structured data. Inspired by KiRoom architecture. Phase 1: Store messages in SQLite/JSON alongside tmux (searchable history, proper metadata). Phase 2: Custom output panel rendering markdown messages + collapsible tool calls, separate compose input box, message queueing. Phase 3: Idle culling + transparent resume via claude --resume. Phase 4: Room organization (group sessions by project/topic). Key insight: use tmux as headless process manager, not as the UI. See features/session-redesign/requirements.md for full analysis.', category: 'tooling', id: 13, added: '2026-05-20', designDoc: 'features/session-redesign/requirements.md' },
  { id: 14, priority: 'high', status: 'done', title: 'Regression test infrastructure (expose globals + helpers)', detail: 'Expose WorldStateManager, AttackComboComponent, HealthComponent, WalkComponent, StateMachineComponent to test mode globals. Create interaction helpers: combat.js (getPunchState, isPunching, getEnemyHealth, getEnemyCount), flags.js (setFlag, getFlag, isFlagTrue, waitForFlagSync), state.js (getPlayerState, getPlayerHealth, isPlayerDead). Prerequisite for all other test tasks.', category: 'testing', added: '2026-05-20', designDoc: 'features/regression-tests/tasks.md' },
  { id: 15, priority: 'high', status: 'done', title: 'Test: Basic punch (canPunch flag gating)', detail: 'Create test-combat.json test level. Tests: punch works when canPunch=true, punch blocked when canPunch=false, punch state returns to idle after duration, punch works when flag toggled mid-game (catches CachedFlag regression). This is the #1 priority test — directly catches the bug we just fixed.', category: 'testing', added: '2026-05-20', designDoc: 'features/regression-tests/tasks.md' },
  { id: 16, priority: 'high', status: 'done', title: 'Test: CachedFlag loadFromFile regression guard', detail: 'Verify that when game loads with saved state containing flags (canPunch, canSwim, etc.), all CachedFlag instances reflect the loaded values. This is the exact regression test for the loadFromFile() subscriber notification bug.', category: 'testing', added: '2026-05-20', designDoc: 'features/regression-tests/tasks.md' },
  { id: 17, priority: 'high', status: 'done', title: 'Test: Flag gating for all abilities', detail: 'Test all flag-gated abilities: canPunch (punch), canPush (push blocks), canJump (jump icon + execution), canSwim (water entry). Each flag tested as both enabled and disabled. Ensures no ability silently breaks.', category: 'testing', added: '2026-05-20', designDoc: 'features/regression-tests/tasks.md' },
  { id: 18, priority: 'medium', status: 'done', title: 'Test: Punch deals damage to enemies', detail: 'Create test level with stationary enemy. Tests: enemy takes damage from punch in range, no damage from out-of-range punch, enemy destroyed after enough hits.', category: 'testing', added: '2026-05-20', designDoc: 'features/regression-tests/tasks.md' },
  { id: 19, priority: 'medium', status: 'done', title: 'Test: Flag persistence across level transitions', detail: 'Verify flags survive level transitions and save/reload. Tests: canPunch persists through transition, flags loaded from save reflect in CachedFlag values.', category: 'testing', added: '2026-05-20', designDoc: 'features/regression-tests/tasks.md' },
  { id: 20, priority: 'medium', status: 'done', title: 'Test: Push block mechanics', detail: 'Create test-push.json level. Tests: pushable moves when canPush=true and player holds into it, block stops at walls, push blocked when canPush=false.', category: 'testing', added: '2026-05-20', designDoc: 'features/regression-tests/tasks.md' },
  { id: 21, priority: 'medium', status: 'done', title: 'Test: Jump across gaps', detail: 'Create test-jump.json level with 1-cell gap. Tests: jump works when canJump=true at edge, player blocked when canJump=false, player lands at correct cell after jump.', category: 'testing', added: '2026-05-20', designDoc: 'features/regression-tests/tasks.md' },
  { id: 22, priority: 'medium', status: 'done', title: 'Test: Health, damage, and death', detail: 'Tests: player health decreases on damage, player enters death state at 0 health, health regen works over time. Can use programmatic damage via setPlayerHealth or enemy projectile.', category: 'testing', added: '2026-05-20', designDoc: 'features/regression-tests/tasks.md' },
  { id: 23, priority: 'low', status: 'done', title: 'Test: Super punch (charge attack)', detail: 'Tests: holding attack >1000ms with hasSuperPunch=true fires super punch (higher damage), releasing early fires normal punch, no charge without hasSuperPunch flag.', category: 'testing', added: '2026-05-20', designDoc: 'features/regression-tests/tasks.md' },
  { id: 24, priority: 'low', status: 'done', title: 'Test: Punch while moving', detail: 'Tests: punch fires during walk state, player resumes walking after punch completes. Verifies walking_punch animation path.', category: 'testing', added: '2026-05-20', designDoc: 'features/regression-tests/tasks.md' },
  { id: 25, priority: 'low', status: 'done', title: 'Test: Water/swim gating', detail: 'Create test-swim.json level. Tests: player enters water when canSwim=true, blocked when false, punch disabled while swimming.', category: 'testing', added: '2026-05-20', designDoc: 'features/regression-tests/tasks.md' },
  { id: 26, priority: 'low', status: 'done', title: 'Test: Triggers and events', detail: 'Create test-triggers.json level with trigger zones. Tests: entering trigger cell fires event, trigger sets flag correctly, once-only triggers only fire once.', category: 'testing', added: '2026-05-20', designDoc: 'features/regression-tests/tasks.md' },
  { id: 27, priority: 'low', status: 'done', title: 'Test: Full gameplay loop smoke test', detail: 'End-to-end test: player moves to enemy, punches it to death, survives. Verifies no crashes in the core combat loop with all systems interacting.', category: 'testing', added: '2026-05-20', designDoc: 'features/regression-tests/tasks.md' },
  { priority: 'low', status: 'done', title: 'path edges', detail: 'The paths are generated by the game engine based on a single tile. we draw a black outline around the edge of the path. I want to experiment with something.... rarther than having a thick black outline, can we instead have a kind of blend happening between the path and the stone, make it look like an aged stone path. you can have kinda jagged edges around the path as well', category: 'graphics', id: 28, added: '2026-05-23' },
  { priority: 'medium', status: 'planned', title: 'Dynamic Z of backgroundTextures', detail: 'In the edtiro, it is possible to override the Z for a background sprite. I want to have another option here too: dynamic Z. If this is selected, then depending on the player position, the backgroundSprite\'s Z changes. If the player is below the sprite, then render the player on top. if the player is above the sprite, then render the sprite on top. This is to emulate distance calculations, appear in front if the player is lower in the screen, appear behind if the player is higher in the screen', category: 'graphics', id: 29, added: '2026-05-24' },
];

function priorityOrder(p) { return { high: 0, medium: 1, low: 2 }[p] ?? 3; }
function statusOrder(s) { return { 'in-progress': 0, planned: 1, done: 2, cancelled: 3 }[s] ?? 4; }

function renderStats() {
  const el = document.getElementById('stats');
  const planned = FEATURES.filter(f => f.status === 'planned').length;
  const inProgress = FEATURES.filter(f => f.status === 'in-progress').length;
  const done = FEATURES.filter(f => f.status === 'done').length;
  el.innerHTML = `
    <div class="stat"><div class="stat-value">${FEATURES.length}</div><div class="stat-label">Total</div></div>
    <div class="stat"><div class="stat-value" style="color:#fff">${planned}</div><div class="stat-label">Planned</div></div>
    <div class="stat"><div class="stat-value" style="color:var(--in-progress)">${inProgress}</div><div class="stat-label">In Progress</div></div>
    <div class="stat"><div class="stat-value" style="color:var(--done)">${done}</div><div class="stat-label">Done</div></div>
  `;
}

function renderTable(filter) {
  const tbody = document.getElementById('tbody');
  let items = [...FEATURES];
  if (['planned','in-progress','done','cancelled'].includes(filter)) items = items.filter(f => f.status === filter);
  else if (['high','medium','low'].includes(filter)) items = items.filter(f => f.priority === filter);
  items.sort((a, b) => statusOrder(a.status) - statusOrder(b.status) || priorityOrder(a.priority) - priorityOrder(b.priority));

  if (items.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7" class="empty">No features logged yet.</td></tr>';
    return;
  }
  tbody.innerHTML = items.map(f => `
    <tr class="${f.status}">
      <td>${f.id}</td>
      <td><span class="badge badge-${f.priority}">${f.priority}</span></td>
      <td><span class="badge badge-${f.status}">${f.status.replace('-', ' ')}</span></td>
      <td><strong>${f.title}</strong>${f.detail ? '<details><summary>Details</summary><p>' + f.detail + (f.designDoc ? '<br/><br/><a href="../' + f.designDoc + '" style="color:#4fc3f7">📄 Design Doc</a>' : '') + '</p></details>' : ''}</td>
      <td>${f.category || '—'}</td>
      <td>${f.added}</td>
      <td class="actions">
        <button class="act-btn" title="Edit this feature" onclick="editEntry(${f.id})">✏️</button>
        ${f.status === 'planned' ? `<button class="act-btn" title="Mark as in progress" onclick="setStatus(${f.id},'in-progress')">▶ Start</button>` : ''}
        ${f.status === 'in-progress' ? `<button class="act-btn" title="Mark as done" onclick="setStatus(${f.id},'done')">✓ Done</button>` : ''}
        ${f.status === 'planned' ? `<button class="act-btn" title="Mark as done" onclick="setStatus(${f.id},'done')">✓ Done</button>` : ''}
        ${f.status !== 'cancelled' && f.status !== 'done' ? `<button class="act-btn" title="Cancel this feature" onclick="setStatus(${f.id},'cancelled')">✗</button>` : ''}
        ${f.status === 'done' || f.status === 'cancelled' ? `<button class="act-btn" title="Reopen this feature" onclick="setStatus(${f.id},'planned')">↺ Reopen</button>` : ''}
        ${f.status !== 'done' ? `<button class="act-btn fix" title="Impl with Kiro" onclick="fixEntry(${f.id},'kiro')">🤖 Impl</button>` : ''}
        ${f.status !== 'done' ? `<button class="act-btn fix" title="Impl with Claude" onclick="fixEntry(${f.id},'claude')" style="border-color:#b388ff;color:#b388ff;background:#1a1a3a">🟣 Impl</button>` : ''}
        ${f.status !== 'done' ? `<button class="act-btn" title="Diagnose: explain the feature and approach without changing code" onclick="diagnoseEntry(${f.id})">🔍</button>` : ''}
      </td>
    </tr>
  `).join('');
}

document.getElementById('filters').addEventListener('click', e => {
  if (!e.target.matches('.filter-btn')) return;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  renderTable(e.target.dataset.filter);
});

renderStats();
renderTable('all');

function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2000); }
function toggleAddForm() { document.getElementById('addForm').classList.toggle('visible'); }

async function setStatus(id, status) {
  await fetch('/api/tracker/update', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ tracker: 'features', id, fields: { status } }) });
  const f = FEATURES.find(f => f.id === id);
  if (f) f.status = status;
  renderStats();
  renderTable(document.querySelector('.filter-btn.active')?.dataset.filter || 'all');
  showToast(`Feature #${id} → ${status}`);
}

async function addEntry() {
  const title = document.getElementById('add-title').value.trim();
  if (!title) return;
  const entry = { priority: document.getElementById('add-priority').value, status: document.getElementById('add-status').value, title, detail: document.getElementById('add-detail').value.trim(), category: document.getElementById('add-category').value.trim() };
  const res = await fetch('/api/tracker/add', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ tracker: 'features', entry }) });
  const result = await res.json();
  entry.id = result.id; entry.added = new Date().toISOString().slice(0, 10);
  FEATURES.push(entry);
  renderStats(); renderTable('all');
  document.getElementById('addForm').classList.remove('visible');
  ['add-title','add-detail','add-category'].forEach(id => document.getElementById(id).value = '');
  showToast(`Feature #${result.id} added`);
}

async function fixEntry(id, engine = 'kiro') {
  const f = FEATURES.find(f => f.id === id);
  if (!f) return;
  const tag = engine === 'claude' ? '🟣' : '🤖';
  try {
    const resp = await fetch('/api/tracker/fix', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ tracker: 'features', id, title: f.title, detail: f.detail || '', engine }) });
    if (!resp.ok) { showToast(`❌ Server error: ${resp.status} ${await resp.text()}`); return; }
    const data = await resp.json();
    if (data.sessionId) {
      const sessionWindow = window.open(`sessions.html?session=${data.sessionId}`, 'db-sessions');
      if (sessionWindow) sessionWindow.focus();
    }
    showToast(`${tag} Session started for feature #${id}`);
  } catch (err) { showToast(`❌ Failed: ${err.message}`); }
}

async function diagnoseEntry(id) {
  const f = FEATURES.find(f => f.id === id);
  if (!f) return;
  const resp = await fetch('/api/tracker/fix', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ tracker: 'features', id, title: f.title, detail: f.detail || '', diagnoseOnly: true }) });
  const data = await resp.json();
  if (data.sessionId) { 
    const sessionWindow = window.open(`sessions.html?session=${data.sessionId}`, 'db-sessions');
    if (sessionWindow) sessionWindow.focus();
  }
  showToast(`🔍 Diagnosing feature #${id}...`);
}

function editEntry(id) {
  const f = FEATURES.find(f => f.id === id);
  if (!f) return;
  document.getElementById('edit-id').value = id;
  document.getElementById('edit-title').value = f.title || '';
  document.getElementById('edit-priority').value = f.priority || 'medium';
  document.getElementById('edit-category').value = f.category || '';
  document.getElementById('edit-detail').value = f.detail || '';
  document.getElementById('editModal').classList.add('visible');
}

function closeEditModal() { document.getElementById('editModal').classList.remove('visible'); }

async function saveEdit() {
  const id = Number(document.getElementById('edit-id').value);
  const fields = {
    title: document.getElementById('edit-title').value.trim(),
    priority: document.getElementById('edit-priority').value,
    category: document.getElementById('edit-category').value.trim(),
    detail: document.getElementById('edit-detail').value.trim(),
  };
  await fetch('/api/tracker/update', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ tracker: 'features', id, fields }) });
  const f = FEATURES.find(f => f.id === id);
  if (f) Object.assign(f, fields);
  closeEditModal();
  renderTable(document.querySelector('.filter-btn.active')?.dataset.filter || 'all');
  showToast(`Feature #${id} updated`);
}
</script>
</body>

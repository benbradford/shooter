<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect rx='6' width='32' height='32' fill='%23143'/><path d='M8 10l3 3 6-6M8 20l3 3 6-6' stroke='%2366bb6a' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
<title>DB - Tracker</title>
<style>
  :root { --bg: #1a1a2e; --surface: #16213e; --surface2: #0f3460; --text: #e0e0e0; --muted: #888; --border: #333; --critical: #ff4444; --high: #ff8c00; --medium: #ffd700; --low: #4fc3f7; --fixed: #66bb6a; --wontfix: #9e9e9e; --investigating: #ab47bc; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 24px; line-height: 1.5; }
  h1 { font-size: 1.8rem; margin-bottom: 4px; }
  .subtitle { color: var(--muted); margin-bottom: 24px; font-size: 0.9rem; }
  .back { color: var(--muted); text-decoration: none; font-size: 0.85rem; display: inline-block; margin-bottom: 16px; }
  .back:hover { color: var(--text); }
  .stats { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
  .stat { background: var(--surface); border-radius: 8px; padding: 12px 20px; min-width: 120px; }
  .stat-value { font-size: 1.6rem; font-weight: bold; }
  .stat-label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
  .filter-btn { background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 6px 14px; border-radius: 16px; cursor: pointer; font-size: 0.8rem; transition: 0.2s; }
  .filter-btn:hover { border-color: var(--text); }
  .filter-btn.active { background: var(--surface2); border-color: #5599ff; color: #fff; }
  table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: 8px; overflow: hidden; }
  thead { background: var(--surface2); }
  th { text-align: left; padding: 10px 14px; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); }
  td { padding: 10px 14px; border-top: 1px solid var(--border); font-size: 0.85rem; vertical-align: top; }
  tr.fixed td { opacity: 0.5; text-decoration: line-through; }
  tr.wontfix td { opacity: 0.45; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; }
  .badge-critical { background: var(--critical); color: #fff; }
  .badge-high { background: var(--high); color: #000; }
  .badge-medium { background: var(--medium); color: #000; }
  .badge-low { background: var(--low); color: #000; }
  .badge-fixed { background: var(--fixed); color: #000; }
  .badge-wontfix { background: var(--wontfix); color: #000; }
  .badge-investigating { background: var(--investigating); color: #fff; }
  .badge-open { background: transparent; border: 1px solid var(--muted); color: var(--muted); }
  details { margin-top: 4px; }
  details summary { cursor: pointer; color: var(--muted); font-size: 0.8rem; }
  details p { margin-top: 4px; font-size: 0.8rem; color: var(--muted); line-height: 1.4; }
  .actions { display: flex; gap: 4px; flex-wrap: wrap; }
  .act-btn { background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 2px 8px; border-radius: 6px; cursor: pointer; font-size: 0.7rem; transition: 0.2s; white-space: nowrap; }
  .act-btn:hover { border-color: var(--text); }
  .act-btn.fix { background: #1a4a1a; border-color: var(--fixed); color: var(--fixed); }
  .act-btn.fix:hover { background: #2a6a2a; }
  .add-form { background: var(--surface); border-radius: 8px; padding: 16px; margin-bottom: 20px; display: none; }
  .add-form.visible { display: block; }
  .add-form input, .add-form select, .add-form textarea { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 6px 10px; border-radius: 6px; font-size: 0.85rem; width: 100%; margin-bottom: 8px; box-sizing: border-box; font-family: inherit; }
  .add-form textarea { min-height: 60px; resize: vertical; }
  .add-form label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 2px; }
  .add-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .toast { position: fixed; bottom: 20px; right: 20px; background: var(--fixed); color: #000; padding: 10px 20px; border-radius: 8px; font-weight: 600; font-size: 0.85rem; opacity: 0; transition: opacity 0.3s; z-index: 999; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<a class="back" href="main.html">← Back to Trackers</a>
<h1>🐛 Bug Tracker</h1>
<p class="subtitle">Dodging Bullets — Known Bugs &amp; Issues</p>

<div class="stats" id="stats"></div>

<div class="filters" id="filters">
  <button class="filter-btn active" data-filter="all">All</button>
  <button class="filter-btn" data-filter="open">Open</button>
  <button class="filter-btn" data-filter="investigating">Investigating</button>
  <button class="filter-btn" data-filter="fixed">Fixed</button>
  <button class="filter-btn" data-filter="wontfix">Won't Fix</button>
  <button class="filter-btn" data-filter="critical">Critical</button>
  <button class="filter-btn" data-filter="high">High</button>
  <button class="filter-btn" data-filter="medium">Medium</button>
  <button class="filter-btn" data-filter="low">Low</button>
  <button class="filter-btn" style="margin-left:auto;background:var(--surface2);border-color:var(--fixed);color:var(--fixed)" onclick="toggleAddForm()">+ Add Bug</button>
</div>

<div class="add-form" id="addForm">
  <div class="add-row">
    <div><label>Title</label><input id="add-title" placeholder="Bug title" /></div>
    <div><label>Area</label><input id="add-area" placeholder="e.g. combat, pet, hud" /></div>
  </div>
  <div class="add-row">
    <div><label>Severity</label><select id="add-severity"><option>medium</option><option>low</option><option>high</option><option>critical</option></select></div>
    <div><label>Status</label><select id="add-status"><option>open</option><option>investigating</option></select></div>
  </div>
  <label>Detail</label><textarea id="add-detail" placeholder="Steps to reproduce, expected vs actual..."></textarea>
  <button class="act-btn" style="padding:6px 16px;font-size:0.85rem" onclick="addEntry()">Add Bug</button>
</div>

<div class="toast" id="toast"></div>

<table>
  <thead>
    <tr>
      <th style="width:30px">#</th>
      <th style="width:80px">Severity</th>
      <th style="width:100px">Status</th>
      <th>Bug</th>
      <th style="width:100px">Area</th>
      <th style="width:80px">Added</th>
      <th style="width:140px">Actions</th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>

<script>
// ── STATUS: open | investigating | fixed | wontfix ──
// ── SEVERITY: critical | high | medium | low ──
const BUGS = [
  { id: 1, severity: 'medium', status: 'fixed', title: 'Push icon appears without canPush flag', detail: 'Walking into a pushable entity shows the push icon on the HUD attack button even when canPush WorldState flag is not set to "true". The player correctly cannot enter push state, but the icon override still triggers visually. Fixed by user.', area: 'pushable', added: '2026-05-04' },
  { id: 2, severity: 'high', status: 'fixed', title: 'Pet stuck at level start in dungeon3right', detail: 'Pet spawned at player feet Y position, but collision box (offsetY:8, height:14) overlapped into platform cell below. Fixed by adding PET_SPAWN_OFFSET_Y_PX = -10 to shift pet spawn 10px upward, keeping collision box clear of adjacent platforms.', area: 'pet', added: '2026-05-04' },
  { id: 3, severity: 'medium', status: 'fixed', title: 'Special item pickup distance inconsistent by approach direction', detail: 'Distance measured from player grid collision box center (32px below sprite origin due to offsetY:24 + height/2:8) to item transform (cell center). The 24px pickup radius was too small to cover the asymmetry — approaching from south required getting much closer. Increased PICKUP_DISTANCE_PX from 24 to 48.', area: 'pickup', added: '2026-05-04' },
  { id: 4, severity: 'medium', status: 'fixed', title: 'Health bar shows empty during interactions', detail: 'During NPC interactions the health bar sometimes displayed as empty despite having health. Fixed by hiding the health bar entirely during interactions — HudBarComponent checks isInInteraction and sets all bar elements to alpha 0.', area: 'hud', added: '2026-05-04' },
  { severity: 'low', status: 'open', title: 'duplicate fav icons', detail: 'the editor, game and tracker all use the same favicon, this makes it difficult to distinguish what each tab is for. It would also help if the tracker was just called \'DB - Tracker\' and the editor was just called \'DB - Editor\' so i can easily see the name in the tabs', area: 'meta', id: 5, added: '2026-05-04' },
  { severity: 'low', status: 'open', title: 'Editor switching views when clearing textures', detail: 'When i select a cell and clear the texture in it, there are some drastic changes to the view, for instance, the water textures all disappear and just display debug graphics. shadows start rendering on platforms even when the level theme doesn\'t have shadows.', area: 'editor', id: 6, added: '2026-05-04' },
];

function severityOrder(s) { return { critical: 0, high: 1, medium: 2, low: 3 }[s] ?? 4; }
function statusOrder(s) { return { open: 0, investigating: 1, fixed: 2, wontfix: 3 }[s] ?? 4; }

function renderStats() {
  const el = document.getElementById('stats');
  const open = BUGS.filter(b => b.status === 'open').length;
  const investigating = BUGS.filter(b => b.status === 'investigating').length;
  const fixed = BUGS.filter(b => b.status === 'fixed').length;
  const critical = BUGS.filter(b => b.severity === 'critical' && b.status !== 'fixed').length;
  el.innerHTML = `
    <div class="stat"><div class="stat-value">${BUGS.length}</div><div class="stat-label">Total</div></div>
    <div class="stat"><div class="stat-value" style="color:var(--critical)">${critical}</div><div class="stat-label">Critical Open</div></div>
    <div class="stat"><div class="stat-value" style="color:#fff">${open}</div><div class="stat-label">Open</div></div>
    <div class="stat"><div class="stat-value" style="color:var(--investigating)">${investigating}</div><div class="stat-label">Investigating</div></div>
    <div class="stat"><div class="stat-value" style="color:var(--fixed)">${fixed}</div><div class="stat-label">Fixed</div></div>
  `;
}

function renderTable(filter) {
  const tbody = document.getElementById('tbody');
  let items = [...BUGS];
  if (['open','investigating','fixed','wontfix'].includes(filter)) items = items.filter(b => b.status === filter);
  else if (['critical','high','medium','low'].includes(filter)) items = items.filter(b => b.severity === filter);
  items.sort((a, b) => statusOrder(a.status) - statusOrder(b.status) || severityOrder(a.severity) - severityOrder(b.severity));

  if (items.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7" class="empty">No bugs logged yet.</td></tr>';
    return;
  }
  tbody.innerHTML = items.map(b => `
    <tr class="${b.status}">
      <td>${b.id}</td>
      <td><span class="badge badge-${b.severity}">${b.severity}</span></td>
      <td><span class="badge badge-${b.status}">${b.status === 'wontfix' ? "won't fix" : b.status}</span></td>
      <td><strong>${b.title}</strong>${b.detail ? '<details><summary>Details</summary><p>' + b.detail + '</p></details>' : ''}</td>
      <td>${b.area || '—'}</td>
      <td>${b.added}</td>
      <td class="actions">
        ${b.status !== 'fixed' ? `<button class="act-btn" title="Mark as fixed" onclick="setStatus(${b.id},'fixed')">✓ Fixed</button>` : ''}
        ${b.status === 'open' ? `<button class="act-btn" title="Mark as investigating" onclick="setStatus(${b.id},'investigating')">🔍</button>` : ''}
        ${b.status !== 'wontfix' && b.status !== 'fixed' ? `<button class="act-btn" title="Mark as won't fix" onclick="setStatus(${b.id},'wontfix')">✗</button>` : ''}
        ${b.status !== 'fixed' ? `<button class="act-btn fix" title="Invoke kiro-cli to auto-fix this bug" onclick="fixEntry(${b.id})">🤖 Fix</button>` : ''}
        ${b.status !== 'fixed' ? `<button class="act-btn" title="Diagnose: explain the issue and approach without changing code" onclick="diagnoseEntry(${b.id})">🔍</button>` : ''}
      </td>
    </tr>
  `).join('');
}

document.getElementById('filters').addEventListener('click', e => {
  if (!e.target.matches('.filter-btn')) return;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  renderTable(e.target.dataset.filter);
});

renderStats();
renderTable('all');

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

function toggleAddForm() {
  document.getElementById('addForm').classList.toggle('visible');
}

async function setStatus(id, status) {
  await fetch('/api/tracker/update', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ tracker: 'bugs', id, fields: { status } })
  });
  const bug = BUGS.find(b => b.id === id);
  if (bug) bug.status = status;
  renderStats();
  renderTable(document.querySelector('.filter-btn.active')?.dataset.filter || 'all');
  showToast(`Bug #${id} → ${status}`);
}

async function addEntry() {
  const title = document.getElementById('add-title').value.trim();
  if (!title) return;
  const entry = {
    severity: document.getElementById('add-severity').value,
    status: document.getElementById('add-status').value,
    title,
    detail: document.getElementById('add-detail').value.trim(),
    area: document.getElementById('add-area').value.trim(),
  };
  const res = await fetch('/api/tracker/add', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ tracker: 'bugs', entry })
  });
  const result = await res.json();
  entry.id = result.id;
  entry.added = new Date().toISOString().slice(0, 10);
  BUGS.push(entry);
  renderStats();
  renderTable('all');
  document.getElementById('addForm').classList.remove('visible');
  document.getElementById('add-title').value = '';
  document.getElementById('add-detail').value = '';
  document.getElementById('add-area').value = '';
  showToast(`Bug #${result.id} added`);
}

async function fixEntry(id) {
  const bug = BUGS.find(b => b.id === id);
  if (!bug) return;
  if (!confirm(`Invoke kiro-cli to fix: "${bug.title}"?`)) return;
  await fetch('/api/tracker/fix', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ tracker: 'bugs', id, title: bug.title, detail: bug.detail || '' })
  });
  showToast(`🤖 kiro-cli started for bug #${id}`);
}

async function diagnoseEntry(id) {
  const bug = BUGS.find(b => b.id === id);
  if (!bug) return;
  await fetch('/api/tracker/fix', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ tracker: 'bugs', id, title: bug.title, detail: bug.detail || '', diagnoseOnly: true })
  });
  showToast(`🔍 Diagnosing bug #${id}...`);
}
</script>
</body>
</html>

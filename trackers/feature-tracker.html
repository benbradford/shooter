<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect rx='6' width='32' height='32' fill='%23143'/><path d='M8 10l3 3 6-6M8 20l3 3 6-6' stroke='%2366bb6a' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
<title>DB - Tracker</title>
<style>
  :root { --bg: #1a1a2e; --surface: #16213e; --surface2: #0f3460; --text: #e0e0e0; --muted: #888; --border: #333; --high: #ff8c00; --medium: #ffd700; --low: #4fc3f7; --done: #66bb6a; --cancelled: #9e9e9e; --in-progress: #ab47bc; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 24px; line-height: 1.5; }
  h1 { font-size: 1.8rem; margin-bottom: 4px; }
  .subtitle { color: var(--muted); margin-bottom: 24px; font-size: 0.9rem; }
  .back { color: var(--muted); text-decoration: none; font-size: 0.85rem; display: inline-block; margin-bottom: 16px; }
  .back:hover { color: var(--text); }
  .stats { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
  .stat { background: var(--surface); border-radius: 8px; padding: 12px 20px; min-width: 120px; }
  .stat-value { font-size: 1.6rem; font-weight: bold; }
  .stat-label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
  .filter-btn { background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 6px 14px; border-radius: 16px; cursor: pointer; font-size: 0.8rem; transition: 0.2s; }
  .filter-btn:hover { border-color: var(--text); }
  .filter-btn.active { background: var(--surface2); border-color: #5599ff; color: #fff; }
  table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: 8px; overflow: hidden; }
  thead { background: var(--surface2); }
  th { text-align: left; padding: 10px 14px; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); }
  td { padding: 10px 14px; border-top: 1px solid var(--border); font-size: 0.85rem; vertical-align: top; }
  tr.done td { opacity: 0.5; text-decoration: line-through; }
  tr.cancelled td { opacity: 0.45; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; }
  .badge-high { background: var(--high); color: #000; }
  .badge-medium { background: var(--medium); color: #000; }
  .badge-low { background: var(--low); color: #000; }
  .badge-done { background: var(--done); color: #000; }
  .badge-cancelled { background: var(--cancelled); color: #000; }
  .badge-in-progress { background: var(--in-progress); color: #fff; }
  .badge-planned { background: transparent; border: 1px solid var(--muted); color: var(--muted); }
  details { margin-top: 4px; }
  details summary { cursor: pointer; color: var(--muted); font-size: 0.8rem; }
  details p { margin-top: 4px; font-size: 0.8rem; color: var(--muted); line-height: 1.4; }
  .actions { display: flex; gap: 4px; flex-wrap: wrap; }
  .act-btn { background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 2px 8px; border-radius: 6px; cursor: pointer; font-size: 0.7rem; transition: 0.2s; white-space: nowrap; }
  .act-btn:hover { border-color: var(--text); }
  .act-btn.fix { background: #1a4a1a; border-color: var(--done); color: var(--done); }
  .act-btn.fix:hover { background: #2a6a2a; }
  .add-form { background: var(--surface); border-radius: 8px; padding: 16px; margin-bottom: 20px; display: none; }
  .add-form.visible { display: block; }
  .add-form input, .add-form select, .add-form textarea { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 6px 10px; border-radius: 6px; font-size: 0.85rem; width: 100%; margin-bottom: 8px; box-sizing: border-box; font-family: inherit; }
  .add-form textarea { min-height: 60px; resize: vertical; }
  .add-form label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 2px; }
  .add-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .toast { position: fixed; bottom: 20px; right: 20px; background: var(--done); color: #000; padding: 10px 20px; border-radius: 8px; font-weight: 600; font-size: 0.85rem; opacity: 0; transition: opacity 0.3s; z-index: 999; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<a class="back" href="main.html">← Back to Trackers</a>
<h1>✨ Feature Tracker</h1>
<p class="subtitle">Dodging Bullets — Planned Features &amp; Enhancements</p>

<div class="stats" id="stats"></div>

<div class="filters" id="filters">
  <button class="filter-btn active" data-filter="all">All</button>
  <button class="filter-btn" data-filter="planned">Planned</button>
  <button class="filter-btn" data-filter="in-progress">In Progress</button>
  <button class="filter-btn" data-filter="done">Done</button>
  <button class="filter-btn" data-filter="cancelled">Cancelled</button>
  <button class="filter-btn" data-filter="high">High</button>
  <button class="filter-btn" data-filter="medium">Medium</button>
  <button class="filter-btn" data-filter="low">Low</button>
  <button class="filter-btn" style="margin-left:auto;background:var(--surface2);border-color:var(--done);color:var(--done)" onclick="toggleAddForm()">+ Add Feature</button>
</div>

<div class="add-form" id="addForm">
  <div class="add-row">
    <div><label>Title</label><input id="add-title" placeholder="Feature title" /></div>
    <div><label>Category</label><input id="add-category" placeholder="e.g. gameplay, editor, tooling" /></div>
  </div>
  <div class="add-row">
    <div><label>Priority</label><select id="add-priority"><option>medium</option><option>low</option><option>high</option></select></div>
    <div><label>Status</label><select id="add-status"><option>planned</option><option>in-progress</option></select></div>
  </div>
  <label>Detail</label><textarea id="add-detail" placeholder="Feature description..."></textarea>
  <button class="act-btn" style="padding:6px 16px;font-size:0.85rem" onclick="addEntry()">Add Feature</button>
</div>

<div class="toast" id="toast"></div>

<table>
  <thead>
    <tr>
      <th style="width:30px">#</th>
      <th style="width:80px">Priority</th>
      <th style="width:90px">Status</th>
      <th>Feature</th>
      <th style="width:100px">Category</th>
      <th style="width:80px">Added</th>
      <th style="width:160px">Actions</th>
  <tbody id="tbody"></tbody>
</table>

<script>
// ── STATUS: planned | in-progress | done | cancelled ──
// ── PRIORITY: high | medium | low ──
const FEATURES = [
  { id: 1, priority: 'medium', status: 'planned', title: 'Water entry/exit uses jump animation instead of hop', detail: 'Currently entering and exiting water uses a hop sequence that feels jangly. Replace with the same jump animation used for platform/void jumps (JumpComponent), but only jumping a single cell to enter or exit the water. Should feel smooth and consistent with other jump mechanics.', category: 'movement', added: '2026-05-04' },
  { id: 2, priority: 'medium', status: 'planned', title: 'Editor paint tool with in-game rendering', detail: 'Paint directly on the level canvas in the editor and see results in-game. Features: color wheel picker (including alpha/transparency), adjustable brush size, straight line mode (click-drag) and single-cell edits, undo/redo via Cmd+Z / Cmd+Shift+Z plus UI buttons, delete button to remove all paint changes, paint data stored in level JSON and rendered in-game. Should support freehand painting and shift-click straight lines.', category: 'editor', added: '2026-05-04' },
  { id: 3, priority: 'medium', status: 'done', title: 'Interactive project trackers via Vite dev server', detail: 'Make bug/feature/architecture trackers interactive in the browser. Phase 1: Add Vite dev server API endpoints to read/write tracker HTML files (same pattern as level editor save). Add UI buttons to mark items done/fixed, change status, and add new entries via forms. Phase 2 (stretch): Add a "Fix" button that invokes kiro-cli to automatically fix the bug/issue.', category: 'tooling', added: '2026-05-04' },
];

function priorityOrder(p) { return { high: 0, medium: 1, low: 2 }[p] ?? 3; }
function statusOrder(s) { return { 'in-progress': 0, planned: 1, done: 2, cancelled: 3 }[s] ?? 4; }

function renderStats() {
  const el = document.getElementById('stats');
  const planned = FEATURES.filter(f => f.status === 'planned').length;
  const inProgress = FEATURES.filter(f => f.status === 'in-progress').length;
  const done = FEATURES.filter(f => f.status === 'done').length;
  el.innerHTML = `
    <div class="stat"><div class="stat-value">${FEATURES.length}</div><div class="stat-label">Total</div></div>
    <div class="stat"><div class="stat-value" style="color:#fff">${planned}</div><div class="stat-label">Planned</div></div>
    <div class="stat"><div class="stat-value" style="color:var(--in-progress)">${inProgress}</div><div class="stat-label">In Progress</div></div>
    <div class="stat"><div class="stat-value" style="color:var(--done)">${done}</div><div class="stat-label">Done</div></div>
  `;
}

function renderTable(filter) {
  const tbody = document.getElementById('tbody');
  let items = [...FEATURES];
  if (['planned','in-progress','done','cancelled'].includes(filter)) items = items.filter(f => f.status === filter);
  else if (['high','medium','low'].includes(filter)) items = items.filter(f => f.priority === filter);
  items.sort((a, b) => statusOrder(a.status) - statusOrder(b.status) || priorityOrder(a.priority) - priorityOrder(b.priority));

  if (items.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7" class="empty">No features logged yet.</td></tr>';
    return;
  }
  tbody.innerHTML = items.map(f => `
    <tr class="${f.status}">
      <td>${f.id}</td>
      <td><span class="badge badge-${f.priority}">${f.priority}</span></td>
      <td><span class="badge badge-${f.status}">${f.status.replace('-', ' ')}</span></td>
      <td><strong>${f.title}</strong>${f.detail ? '<details><summary>Details</summary><p>' + f.detail + '</p></details>' : ''}</td>
      <td>${f.category || '—'}</td>
      <td>${f.added}</td>
      <td class="actions">
        ${f.status === 'planned' ? `<button class="act-btn" title="Mark as in progress" onclick="setStatus(${f.id},'in-progress')">▶ Start</button>` : ''}
        ${f.status === 'in-progress' ? `<button class="act-btn" title="Mark as done" onclick="setStatus(${f.id},'done')">✓ Done</button>` : ''}
        ${f.status === 'planned' ? `<button class="act-btn" title="Mark as done" onclick="setStatus(${f.id},'done')">✓ Done</button>` : ''}
        ${f.status !== 'cancelled' && f.status !== 'done' ? `<button class="act-btn" title="Cancel this feature" onclick="setStatus(${f.id},'cancelled')">✗</button>` : ''}
        ${f.status !== 'done' ? `<button class="act-btn fix" title="Invoke kiro-cli to implement this feature" onclick="fixEntry(${f.id})">🤖 Impl</button>` : ''}
        ${f.status !== 'done' ? `<button class="act-btn" title="Diagnose: explain the feature and approach without changing code" onclick="diagnoseEntry(${f.id})">🔍</button>` : ''}
      </td>
    </tr>
  `).join('');
}

document.getElementById('filters').addEventListener('click', e => {
  if (!e.target.matches('.filter-btn')) return;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  renderTable(e.target.dataset.filter);
});

renderStats();
renderTable('all');

function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2000); }
function toggleAddForm() { document.getElementById('addForm').classList.toggle('visible'); }

async function setStatus(id, status) {
  await fetch('/api/tracker/update', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ tracker: 'features', id, fields: { status } }) });
  const f = FEATURES.find(f => f.id === id);
  if (f) f.status = status;
  renderStats();
  renderTable(document.querySelector('.filter-btn.active')?.dataset.filter || 'all');
  showToast(`Feature #${id} → ${status}`);
}

async function addEntry() {
  const title = document.getElementById('add-title').value.trim();
  if (!title) return;
  const entry = { priority: document.getElementById('add-priority').value, status: document.getElementById('add-status').value, title, detail: document.getElementById('add-detail').value.trim(), category: document.getElementById('add-category').value.trim() };
  const res = await fetch('/api/tracker/add', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ tracker: 'features', entry }) });
  const result = await res.json();
  entry.id = result.id; entry.added = new Date().toISOString().slice(0, 10);
  FEATURES.push(entry);
  renderStats(); renderTable('all');
  document.getElementById('addForm').classList.remove('visible');
  ['add-title','add-detail','add-category'].forEach(id => document.getElementById(id).value = '');
  showToast(`Feature #${result.id} added`);
}

async function fixEntry(id) {
  const f = FEATURES.find(f => f.id === id);
  if (!f || !confirm(`Invoke kiro-cli to implement: "${f.title}"?`)) return;
  await fetch('/api/tracker/fix', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ tracker: 'features', id, title: f.title, detail: f.detail || '' }) });
  showToast(`🤖 kiro-cli started for feature #${id}`);
}

async function diagnoseEntry(id) {
  const f = FEATURES.find(f => f.id === id);
  if (!f) return;
  await fetch('/api/tracker/fix', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ tracker: 'features', id, title: f.title, detail: f.detail || '', diagnoseOnly: true }) });
  showToast(`🔍 Diagnosing feature #${id}...`);
}
</script>
</body>
</html>

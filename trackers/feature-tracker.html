<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dodging Bullets — Feature Tracker</title>
<style>
  :root { --bg: #1a1a2e; --surface: #16213e; --surface2: #0f3460; --text: #e0e0e0; --muted: #888; --border: #333; --high: #ff8c00; --medium: #ffd700; --low: #4fc3f7; --done: #66bb6a; --cancelled: #9e9e9e; --in-progress: #ab47bc; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 24px; line-height: 1.5; }
  h1 { font-size: 1.8rem; margin-bottom: 4px; }
  .subtitle { color: var(--muted); margin-bottom: 24px; font-size: 0.9rem; }
  .back { color: var(--muted); text-decoration: none; font-size: 0.85rem; display: inline-block; margin-bottom: 16px; }
  .back:hover { color: var(--text); }
  .stats { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
  .stat { background: var(--surface); border-radius: 8px; padding: 12px 20px; min-width: 120px; }
  .stat-value { font-size: 1.6rem; font-weight: bold; }
  .stat-label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
  .filter-btn { background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 6px 14px; border-radius: 16px; cursor: pointer; font-size: 0.8rem; transition: 0.2s; }
  .filter-btn:hover { border-color: var(--text); }
  .filter-btn.active { background: var(--surface2); border-color: #5599ff; color: #fff; }
  table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: 8px; overflow: hidden; }
  thead { background: var(--surface2); }
  th { text-align: left; padding: 10px 14px; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); }
  td { padding: 10px 14px; border-top: 1px solid var(--border); font-size: 0.85rem; vertical-align: top; }
  tr.done td { opacity: 0.5; text-decoration: line-through; }
  tr.cancelled td { opacity: 0.45; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; }
  .badge-high { background: var(--high); color: #000; }
  .badge-medium { background: var(--medium); color: #000; }
  .badge-low { background: var(--low); color: #000; }
  .badge-done { background: var(--done); color: #000; }
  .badge-cancelled { background: var(--cancelled); color: #000; }
  .badge-in-progress { background: var(--in-progress); color: #fff; }
  .badge-planned { background: transparent; border: 1px solid var(--muted); color: var(--muted); }
  details { margin-top: 4px; }
  details summary { cursor: pointer; color: var(--muted); font-size: 0.8rem; }
  details p { margin-top: 4px; font-size: 0.8rem; color: var(--muted); line-height: 1.4; }
  .empty { text-align: center; padding: 48px; color: var(--muted); }
</style>
</head>
<body>

<a class="back" href="main.html">← Back to Trackers</a>
<h1>✨ Feature Tracker</h1>
<p class="subtitle">Dodging Bullets — Planned Features &amp; Enhancements</p>

<div class="stats" id="stats"></div>

<div class="filters" id="filters">
  <button class="filter-btn active" data-filter="all">All</button>
  <button class="filter-btn" data-filter="planned">Planned</button>
  <button class="filter-btn" data-filter="in-progress">In Progress</button>
  <button class="filter-btn" data-filter="done">Done</button>
  <button class="filter-btn" data-filter="cancelled">Cancelled</button>
  <button class="filter-btn" data-filter="high">High</button>
  <button class="filter-btn" data-filter="medium">Medium</button>
  <button class="filter-btn" data-filter="low">Low</button>
</div>

<table>
  <thead>
    <tr>
      <th style="width:30px">#</th>
      <th style="width:80px">Priority</th>
      <th style="width:90px">Status</th>
      <th>Feature</th>
      <th style="width:100px">Category</th>
      <th style="width:80px">Added</th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>

<script>
// ── STATUS: planned | in-progress | done | cancelled ──
// ── PRIORITY: high | medium | low ──
const FEATURES = [
  // { id: 1, priority: 'high', status: 'planned', title: 'Example feature', detail: 'Description of the feature.', category: 'gameplay', added: '2026-05-04' },
];

function priorityOrder(p) { return { high: 0, medium: 1, low: 2 }[p] ?? 3; }
function statusOrder(s) { return { 'in-progress': 0, planned: 1, done: 2, cancelled: 3 }[s] ?? 4; }

function renderStats() {
  const el = document.getElementById('stats');
  const planned = FEATURES.filter(f => f.status === 'planned').length;
  const inProgress = FEATURES.filter(f => f.status === 'in-progress').length;
  const done = FEATURES.filter(f => f.status === 'done').length;
  el.innerHTML = `
    <div class="stat"><div class="stat-value">${FEATURES.length}</div><div class="stat-label">Total</div></div>
    <div class="stat"><div class="stat-value" style="color:#fff">${planned}</div><div class="stat-label">Planned</div></div>
    <div class="stat"><div class="stat-value" style="color:var(--in-progress)">${inProgress}</div><div class="stat-label">In Progress</div></div>
    <div class="stat"><div class="stat-value" style="color:var(--done)">${done}</div><div class="stat-label">Done</div></div>
  `;
}

function renderTable(filter) {
  const tbody = document.getElementById('tbody');
  let items = [...FEATURES];
  if (['planned','in-progress','done','cancelled'].includes(filter)) items = items.filter(f => f.status === filter);
  else if (['high','medium','low'].includes(filter)) items = items.filter(f => f.priority === filter);
  items.sort((a, b) => statusOrder(a.status) - statusOrder(b.status) || priorityOrder(a.priority) - priorityOrder(b.priority));

  if (items.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6" class="empty">No features logged yet. Say "log a feature" to add one.</td></tr>';
    return;
  }
  tbody.innerHTML = items.map(f => `
    <tr class="${f.status}">
      <td>${f.id}</td>
      <td><span class="badge badge-${f.priority}">${f.priority}</span></td>
      <td><span class="badge badge-${f.status}">${f.status.replace('-', ' ')}</span></td>
      <td><strong>${f.title}</strong>${f.detail ? '<details><summary>Details</summary><p>' + f.detail + '</p></details>' : ''}</td>
      <td>${f.category || '—'}</td>
      <td>${f.added}</td>
    </tr>
  `).join('');
}

document.getElementById('filters').addEventListener('click', e => {
  if (!e.target.matches('.filter-btn')) return;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  renderTable(e.target.dataset.filter);
});

renderStats();
renderTable('all');
</script>
</body>
</html>
